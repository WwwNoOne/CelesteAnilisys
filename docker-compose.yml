services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://celeste:celeste@db:5432/celeste
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:Z
      - ./data/examples:/app/data/examples:Z
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: celeste
      POSTGRES_USER: celeste
      POSTGRES_PASSWORD: celeste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeste -d celeste"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
